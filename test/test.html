<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>美化log</title>
    <link rel="stylesheet" href="./console-panel.css">
</head>
<body>
<!-- 触发词彩蛋演示区：悬浮于 console 面板之上（面板 z-index 1000）。
     动画画布 z-index 99999 但 pointer-events:none，播放期间按钮照常可点。 -->
<section id="fx-demo"
         style="position:fixed;top:8px;right:8px;z-index:1001;max-width:380px;
                background:#292a2d;color:#e8eaed;border:1px solid #3c4043;border-radius:6px;
                padding:10px 12px;font:13px/1.6 Consolas,'Microsoft YaHei',sans-serif;">
    <strong style="display:block;margin-bottom:4px;">触发词彩蛋</strong>
    <p style="margin:0 0 8px;color:#9aa0a6;">点击按钮输出带触发词的日志即可播放动画：连续触发只播一次，播完约 2 秒冷却。</p>
    <button id="fx-btn-fireworks">info('烟花')</button>
    <button id="fx-btn-confetti">info('撒花')</button>
    <button id="fx-btn-snow">info('下雪')</button>
    <button id="fx-btn-rain">info('下雨')</button>
    <button id="fx-btn-lightning">info('打雷')</button>
    <button id="fx-btn-toggle">关闭彩蛋</button>
</section>
<script type="module">
    // 必须最先安装面板，才能捕获后续所有日志
    import { installConsolePanel } from './console-panel.js'
    installConsolePanel()

    import * as prettyLog from '../src/index.ts'
    // 暴露到全局便于目检时在控制台注入样例数据（仅测试页，不影响库本身）
    window.prettyLog = prettyLog

    // 本地样图：内联为 data URI，彻底不依赖网络与打包器的静态资源管线。
    // （早前试过 './sample.png' 与 '/test/sample.png' 两种相对路径，
    //   两者都会被 Parcel dev server 的 SPA fallback 吞成 test.html，
    //   静态资源 import 在 HTML entry 下亦解析为空对象。）
    const SAMPLE_PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUAAAAB4CAIAAAAMrLyJAAAEbUlEQVR42u3T5VqQBxgAUC/RhXOdzrWFKBIGYVBKidKpUiKtlEioC+c6nev72Pu9t7C/53nOLZxdu8se7i57EJ4JJ+4/m54L5TvPpz3l23sqtl9Ieyu29lYWXqzcDC9VFV6uuhdeORk2Xk2vnQp3X09vnA7r4c1wZu2t9HaoXn0n7ate2Vez8m7aX7O8v7bwXu2d8H5d4YO62+HDs2Hpo/TxubD4STpwPiyEg+HC/KF0ONTPHUkl9bMlDbNHU2nDTGlj4VjjrXC8qVDWNB1ONIeb5aniYpiqTFWXwmQ4GVomTqXToXX8TKpuHatuG6tJtW03atsLde3Xw9mOwrmOa+H85TB6IdV3hpGG1HglDIemcHWoOV0MXYOXUkvXQEv3QGtq6+5v6ym09/SFjt7C5d7e0NkXeq6kq/2huyt1D4Su0BMGr/amvjB0pT8NDHUODHcOpqHhy0MjheGRjjAyWhgdbQ/XroW26+nG9dA6lsZvhJYwEcYuTaapMH7xZpoeb56eaL6VZiaaZiYLs5ONYW6qMD/VEBZuhvrFtDQdLtxOd26F82E5zJxbSath9uxaWp+tW5+ru5s25mo35gv35mvC5kJha6E6bC+GMzvp/lI4/SA9vB1OhU/DnZOfpc/DctUX6dFy5aOVyi/T45WKx6uFr1bLw9drhW/WToRv10PZd+n7u+H4D+nHjXAs/BTulf6cfgmbR39NTzZLnmyV/Jaebh15ul34fftw+GOn8OfOofDX/XDw7/TPg3Dg37RLYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBRZYYIEFFlhggQUWWGCBBf6/gf8DsjmJr2xUDlgAAAAASUVORK5CYII='

    // 信息
    prettyLog.info("Hello world!")
    prettyLog.info("信息", "Hello world!")
    prettyLog.info("信息", "Hello world!", {a: 1, b: 2, c: 3})

    // 错误
    prettyLog.error("Hello world!")
    prettyLog.error("错误", "Hello world!")
    prettyLog.error("错误", "Hello world!", {a: 1, b: 2, c: 3})

    // 警告
    prettyLog.warning("Hello world!")
    prettyLog.warning("警告", "Hello world!")
    prettyLog.warning("警告", "Hello world!", {a: 1, b: 2, c: 3})

    // 成功
    prettyLog.success("Hello world!")
    prettyLog.success("成功", "Hello world!")
    prettyLog.success("成功", "Hello world!", {a: 1, b: 2, c: 3})

    // 调试
    prettyLog.debug("调试信息")
    prettyLog.debug("Debug", "详细调试数据", {debug: true})

    // 彩虹
    prettyLog.rainbow("来 左边 跟我一起画个龙在你右边 画一道彩虹")

    // 组输出，默认展开
    prettyLog.group("一个组输出", ["组内容1", "组内容2", "组内容3"])

    // 组输出，折叠
    prettyLog.group("一个组输出", ["组内容1", "组内容2", "组内容3"], false, '#e66815')

    // 表格
    prettyLog.table([{a: 1, b: 1, c: 1}, {a: 2, b: 2, c: 2}, {a: 3, b: 3, c: 3}])

    // 计时器
    prettyLog.time('计时器');
    // 执行一些操作...
    setTimeout(() => {
        prettyLog.timeEnd('计时器');
    }, 2000); // 2000 毫秒 = 2 秒

    // 图片（内联本地样图，不依赖外网）
    prettyLog.picture(SAMPLE_PNG, 1)

    // json格式
    prettyLog.info({a: 100, b: {b1: '一一一', b2: '二二二'}, c: [5, 6, 7]})
    prettyLog.info("JSON", {a: 100, b: {b1: '一一一', b2: '二二二'}, c: [5, 6, 7]})

    // ===== 新特性演示 =====

    // --- 日志级别过滤 ---
    console.log('--- 日志级别过滤 ---')
    prettyLog.configure({ logLevel: 'warn' })
    prettyLog.debug('这条不会显示')   // 被过滤
    prettyLog.info('这条也不会显示')  // 被过滤
    prettyLog.warning('警告会显示')
    prettyLog.error('错误会显示')
    prettyLog.configure({ logLevel: 'debug' })  // 恢复

    // --- Emoji + 时间戳 ---
    console.log('--- Emoji + 时间戳 ---')
    prettyLog.showEmoji(true)
    prettyLog.showTimestamp(true)
    prettyLog.info("带 Emoji 和时间戳")
    prettyLog.error("错误也有 Emoji 和时间戳")
    prettyLog.success("成功消息")

    // --- 日志历史 ---
    console.log('--- 日志历史 ---')
    const history = prettyLog.getHistory()
    console.log(`历史记录数量: ${history.length}`)
    console.log('最近5条:', JSON.stringify(history.slice(-5), null, 2))

    // --- 自定义主题 ---
    console.log('--- 自定义主题 ---')
    prettyLog.setTheme({ fills: { info: '#00FF00', error: '#FF0000' }, texts: { info: '#00FF00', error: '#FF0000' } })
    prettyLog.info("绿色信息")
    prettyLog.error("红色错误")
    prettyLog.resetTheme()  // 恢复

    // --- 一次性配置 ---
    console.log('--- 一次性配置 ---')
    prettyLog.configure({
        showEmoji: false,
        showTimestamp: false,
    })
    prettyLog.info("关闭 Emoji 和时间戳")

    // ===== 新增功能演示 =====

    // --- 异步计时器（异常路径也会结束计时） ---
    console.log('--- timer 异步计时 ---')
    prettyLog.timer('fetch-用户数据', () =>
        new Promise((resolve) => setTimeout(() => resolve('done'), 300))
    )

    // --- 只输出一次 ---
    console.log('--- once 只输出一次 ---')
    for (let i = 0; i < 5; i++) {
        prettyLog.once('render-once', '这条只会出现一次', `第 ${i} 次调用被忽略`)
    }

    // --- 调用计数 ---
    console.log('--- count 调用计数 ---')
    ;['api-a', 'api-a', 'api-b'].forEach((k) => prettyLog.count(k))
    console.log('调用统计:', JSON.stringify(prettyLog.countSummary()))
    prettyLog.clearCounters()

    // --- 带前缀的 logger ---
    console.log('--- withPrefix 前缀 logger ---')
    const userLog = prettyLog.withPrefix('用户模块')
    userLog.info('登录成功', { userId: 123 })
    userLog.warning('昵称已存在', '将自动追加数字后缀')

    // --- 断言（失败会抛出，正常流程请勿触发） ---
    console.log('--- assert 断言 ---')
    prettyLog.assert(1 + 1 === 2, '数学基本定理')
    console.log('断言通过，未抛出')

    // --- 自定义样式 ---
    console.log('--- setStyles 自定义样式 ---')
    prettyLog.setStyles({ borderRadius: '8px', padding: '3px 10px' })
    prettyLog.info("圆角和内边距已改变")
    prettyLog.setStyles({ borderRadius: undefined, padding: undefined })  // 恢复默认

    // --- 格式串注入防护 ---
    console.log('--- 百分号转义 ---')
    prettyLog.info("注入测试", "这里有 %c 和 %s，应该原样显示")
    prettyLog.info("百分号", "完成 50%")

    // ===== 触发词彩蛋演示 =====
    // 各按钮分别输出带触发词的日志（单击触发一次，可感受冷却）；
    // 「关闭彩蛋」开关走 setEffects({ enabled }) 一键启停。
    console.log('--- 触发词彩蛋 ---')
    document.getElementById('fx-btn-fireworks').addEventListener('click', () => prettyLog.info('烟花'))
    document.getElementById('fx-btn-confetti').addEventListener('click', () => prettyLog.info('撒花'))
    document.getElementById('fx-btn-snow').addEventListener('click', () => prettyLog.info('下雪'))
    document.getElementById('fx-btn-rain').addEventListener('click', () => prettyLog.info('下雨'))
    document.getElementById('fx-btn-lightning').addEventListener('click', () => prettyLog.info('打雷'))
    const fxToggleBtn = document.getElementById('fx-btn-toggle')
    fxToggleBtn.addEventListener('click', () => {
        const enabled = !prettyLog.getEffects().enabled
        prettyLog.setEffects({ enabled })
        fxToggleBtn.textContent = enabled ? '关闭彩蛋' : '开启彩蛋'
    })
</script>
</body>
</html>
