# 由 GitHub Release 驱动的 npm 发布
#
# 链路：你本地 → Gitee 打 tag → Gitee 镜像同步该 tag 到 GitHub
#         → 你在 GitHub 上创建 Release（选择该 tag）
#         → 本工作流被触发 → 发布到 npm
#
# 为什么用 release 事件而不是 push tag：
# Gitee 镜像同步 tag 时走的是 GitHub API 写 ref，并非真实 git push，
# 因此不会产生 `push` 事件（实测 API 查询 actions/runs 返回
# total_count: 0，尽管 tag 与分支均已同步到位）。
# 而手动创建 Release 是一个真实的用户动作，会产生 `release` 事件，
# 其 GITHUB_REF 为 refs/tags/<tag_name>，正好提供校验所需的 tag 名。
#
# 需要配置的仓库 Secret：
#   NPM_TOKEN  npm 的 automation token（建议 granular 且仅限本包）
#
# Secret 名是 NPM_TOKEN，工作流内部传给 npm 的环境变量则是 NODE_AUTH_TOKEN
# —— 后者要与 .npmrc 里写的 ${NODE_AUTH_TOKEN} 一致，两者不同名是正常的。
#
# GITHUB_TOKEN 由 GitHub 自动注入，本工作流不需要它。

name: Release

on:
  release:
    # 只监听 created。
    # GitHub 对「创建一个此前非 draft 的 Release」会推送两条事件：created 与
    # published（官方文档：Action type: created — A draft was saved, or a release
    # or pre-release was published without previously being saved as a draft）。
    # 同时监听两者会让一次手动发版跑两遍（实测 actions/runs 出现两条同秒记录）。
    # created 已覆盖手动发布这一主路径；published 仅在「先存 draft 再发布」时出现，
    # 那种场景下 created 也已经先触发过了，故无需重复监听。
    types: [created]

# 不需要写权限：本工作流只发布 npm，不推送任何分支或 tag
permissions:
  contents: read

concurrency:
  # 同一 tag 的发布串行化，避免重复发布
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest
    steps:
      # 显式锁定 Node 版本，不依赖 runner 的默认版本。
      # ubuntu-24.04 当前默认 Node 为 22.23.3，而测试直接 import .ts 源文件，
      # 需要 22.6+ 的 --experimental-strip-types（23.6+ 才默认开启）——
      # package.json 的 test:unit 已带上该 flag，锁到 24 是为了与其余行为一致。
      # setup-node 的 registry-url 会生成一份含 ${NODE_AUTH_TOKEN} 的 .npmrc
      # 并把 NPM_CONFIG_USERCONFIG 指向它全局生效；yarn 1 读到该文件里无法替换的
      # ${...} 变量时直接抛 `Failed to replace env in config` 并中止（实测，
      # 连空依赖的包都装不上）。而本工作流的「安装依赖」步骤用的是 yarn，
      # 早于发布步骤且拿不到令牌，故改由发布步骤自己建 .npmrc。
      - name: 准备 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 检出被 release 的 tag
        uses: actions/checkout@v4
        with:
          # release 事件的 ref 形如 refs/tags/v1.2.3，取其 tag 名显式检出
          ref: ${{ github.ref }}
          # 需要完整 tag 信息供版本校验使用
          fetch-depth: 0

      - name: 安装依赖
        run: yarn install --frozen-lockfile

      - name: 校验 tag 与 package.json 版本一致
        run: node scripts/verify-tag-version.js "${{ github.ref_name }}"

      - name: 检查该版本是否已发布（幂等保护）
        # release 事件监听 created + published 两条路径：若先存 draft 再发布，
        # 同一次发版可能被触发两次。npm 版本号无法覆盖，故先查一次，
        # 已发布则以 exit 0 优雅跳过而非让第二次发布失败。
        # 脚本约定：0=已发布(跳过) 1=未发布(继续) 2=检查失败(中止)
        run: |
          set +e
          node scripts/check-version-published.js "${{ github.ref_name }}"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "版本已发布，跳过本次 npm 发布"
            exit 0
          elif [ "$code" -eq 1 ]; then
            echo "版本未发布，继续"
          else
            echo "::error::无法确认版本发布状态，中止"
            exit 1
          fi

      - name: 单元测试
        # 用 offline 变体：它排除需要访问 npm registry 的用例
        # （ci-publish.test.js）。那些用例验的是 npm 的可用性而非本仓代码，
        # CI 网络受限时不应阻塞发布。本地想跑全量用 yarn test:unit。
        #
        # 失败时把完整输出写进 job summary：GitHub 的 logs 接口需要仓库管理员
        # 权限才能读取，外部排查者拿不到，而 summary 对所有有仓库访问权的人可见。
        run: |
          echo "Node: $(node -v) / npm: $(npm -v) / yarn: $(yarn -v)"
          set +e
          yarn test:unit:offline > /tmp/test-output.txt 2>&1
          code=$?
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/test-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/test-output.txt
          exit $code

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建
        run: yarn build

      - name: 诊断认证状态
        # npm 的报错 ENEEDAUTH（need auth）与 E401（Unauthorized）含义不同：
        #   ENEEDAUTH —— 本地就没找到凭据：.npmrc 里没有 _authToken 行，
        #                或那行引用的环境变量为空。请求根本没发出去。
        #   E401     —— 凭据发出去了但被拒：token 过期、权限不足、
        #                或 token 只对别的包有效。
        # 二者混在一起会误导排查方向，故先把事实打出来。
        #
        # 这里自建 .npmrc 而非依赖 setup-node 的 registry-url，原因见上面
        # 「准备 Node 24」的注释：那份 .npmrc 会让前面的 yarn install 崩掉。
        # NPM_CONFIG_USERCONFIG 只对单条命令生效，不 export、不写 $GITHUB_ENV，
        # 因此不会污染其他步骤。
        #
        # 打印长度而非内容，避免令牌泄漏到日志。
        # 输出同时写进 job summary —— steps 的日志需登录态 XHR 拉取，
        # summary 则是页面直接渲染的，无需任何权限。
        # npm config list 对 _authToken 输出 (protected) 而非明文，脱敏后
        # 可安全落进 summary；下面的 sed 是第二道保险。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/npmrc"
          echo "NODE_AUTH_TOKEN 是否为空: $([ -z "$NODE_AUTH_TOKEN" ] && echo 是 || echo 否)"
          echo "NODE_AUTH_TOKEN 长度: ${#NODE_AUTH_TOKEN}"
          {
            echo "--- npm config 认证项（已脱敏）---"
            NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm config list 2>/dev/null | grep -iE "auth|registry|token" | sed -E 's/(_authToken|_auth) *=.*/\1 = <REDACTED>/' || echo "(无)"
            echo "--- whoami 探测 ---"
            NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm whoami --registry https://registry.npmjs.org/ 2>&1 | head -3 || true
          } | tee /tmp/auth-diag.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/auth-diag.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 发布到 npm
        # 凭据靠本步骤现建的 .npmrc 传递：npm 只认 .npmrc 里的 _authToken 行，
        # 不读 NPM_TOKEN 这类环境变量（实测：只有 NPM_TOKEN 环境变量、无 .npmrc
        # 时，publish 直接在本地报 ENEEDAUTH，一次请求都不会发向 registry）。
        # 故变量名必须与 .npmrc 里写的 ${NODE_AUTH_TOKEN} 一致；
        # secret 本身仍叫 NPM_TOKEN，两个名字不同是正常的。
        #
        # 用 npm 而非 yarn publish：yarn 1 同样无法处理这份含 ${...} 的 .npmrc
        # （见上面「准备 Node 24」的注释），npm 则能正常插值。
        # 失败输出写进 job summary：logs 接口需管理员权限，summary 对
        # 所有有仓库访问权的人可见。
        run: |
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/npmrc"
          set +e
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" \
            npm publish --access public --registry https://registry.npmjs.org/ > /tmp/publish.log 2>&1
          code=$?
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/publish.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/publish.log
          exit $code
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}