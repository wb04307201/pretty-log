# 由 GitHub Release 驱动的 npm 发布
#
# 链路：你本地 → Gitee 打 tag → Gitee 镜像同步该 tag 到 GitHub
#         → 你在 GitHub 上创建 Release（选择该 tag）
#         → 本工作流被触发 → 发布到 npm
#
# 为什么用 release 事件而不是 push tag：
# Gitee 镜像同步 tag 时走的是 GitHub API 写 ref，并非真实 git push，
# 因此不会产生 `push` 事件（实测 API 查询 actions/runs 返回
# total_count: 0，尽管 tag 与分支均已同步到位）。
# 而手动创建 Release 是一个真实的用户动作，会产生 `release` 事件，
# 其 GITHUB_REF 为 refs/tags/<tag_name>，正好提供校验所需的 tag 名。
#
# 认证方式：Trusted Publishing（OIDC），**不使用任何 token**。
#
# npm 在包页面把「GitHub Actions + wb04307201/pretty-log + release.yml」
# 登记为可信发布者；本工作流凭 `id-token: write` 权限向 GitHub 换取 id_token，
# npm 用它换成短期的会话令牌。故仓库里不需要、也不应该存在 NPM_TOKEN secret。
#
# npm 侧的绑定在创建后不可修改，改错了只能删除重建。

name: Release

on:
  release:
    # 只监听 created。
    # GitHub 对「创建一个此前非 draft 的 Release」会推送两条事件：created 与
    # published（官方文档：Action type: created — A draft was saved, or a release
    # or pre-release was published without previously being saved as a draft）。
    # 同时监听两者会让一次手动发版跑两遍（实测 actions/runs 出现两条同秒记录）。
    # created 已覆盖手动发布这一主路径；published 仅在「先存 draft 再发布」时出现，
    # 那种场景下 created 也已经先触发过了，故无需重复监听。
    types: [created]

permissions:
  contents: read
  # OIDC 必需：npm 用它向 GitHub 的 OIDC 端点换取 id_token。
  # 缺这一行时 npm CLI 会打印 "Skipped because incorrect permissions for
  # id-token within GitHub workflow" 并静默退回无凭据状态，最终报 ENEEDAUTH。
  id-token: write

concurrency:
  # 同一 tag 的发布串行化，避免重复发布
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest
    steps:
      # 显式锁定 Node 版本，不依赖 runner 的默认版本。
      # ubuntu-24.04 当前默认 Node 为 22.23.3，而测试直接 import .ts 源文件，
      # 需要 22.6+ 的 --experimental-strip-types（23.6+ 才默认开启）——
      # package.json 的 test:unit 已带上该 flag，锁到 24 是为了与其余行为一致。
      #
      # 这里刻意**不**配 registry-url。它会生成一份含 ${NODE_AUTH_TOKEN} 的
      # .npmrc 并把 NPM_CONFIG_USERCONFIG 导出为 job 全局，而 yarn 1 读到
      # 无法替换的 ${...} 会抛 `Failed to replace env in config` 直接中止
      # （实测，连零依赖的空包都装不上），先于发布步骤崩掉。
      # OIDC 不需要 .npmrc：npm CLI 在凭据检查之前就完成 id_token 交换并
      # 直接设置 token，故这里无需任何认证配置。
      - name: 准备 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 确保 npm CLI 支持 OIDC
        # Trusted Publishing 需要 npm >= 11.5.1（更早的版本没有 oidc 交换逻辑，
        # 会静默退回 ENEEDAUTH）。Node 24 自带的 npm 版本会随时间漂移，
        # 故显式升级到最新，不依赖 runner 的捆绑版本。
        # 版本号一并回显：OIDC 失败时日志里能确认当时确实是新版本。
        # 注意一个 step 只能有一个 run 键——写两个会让 GitHub 拒绝加载整个
        # workflow（报 "'run' is already defined"），所有 job 都不会执行。
        run: |
          npm install -g npm@latest
          npm --version

      - name: 检出被 release 的 tag
        uses: actions/checkout@v4
        with:
          # release 事件的 ref 形如 refs/tags/v1.2.3，取其 tag 名显式检出
          ref: ${{ github.ref }}
          # 需要完整 tag 信息供版本校验使用
          fetch-depth: 0

      - name: 安装依赖
        run: yarn install --frozen-lockfile

      - name: 校验 tag 与 package.json 版本一致
        run: node scripts/verify-tag-version.js "${{ github.ref_name }}"

      - name: 检查该版本是否已发布（幂等保护）
        # release 事件监听 created + published 两条路径：若先存 draft 再发布，
        # 同一次发版可能被触发两次。npm 版本号无法覆盖，故先查一次，
        # 已发布则以 exit 0 优雅跳过而非让第二次发布失败。
        # 脚本约定：0=已发布(跳过) 1=未发布(继续) 2=检查失败(中止)
        run: |
          set +e
          node scripts/check-version-published.js "${{ github.ref_name }}"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "版本已发布，跳过本次 npm 发布"
            exit 0
          elif [ "$code" -eq 1 ]; then
            echo "版本未发布，继续"
          else
            echo "::error::无法确认版本发布状态，中止"
            exit 1
          fi

      - name: 单元测试
        # 用 offline 变体：它排除需要访问 npm registry 的用例
        # （ci-publish.test.js）。那些用例验的是 npm 的可用性而非本仓代码，
        # CI 网络受限时不应阻塞发布。本地想跑全量用 yarn test:unit。
        #
        # 失败时把完整输出写进 job summary：GitHub 的 logs 接口需要仓库管理员
        # 权限才能读取，外部排查者拿不到，而 summary 对所有有仓库访问权的人可见。
        run: |
          echo "Node: $(node -v) / npm: $(npm -v) / yarn: $(yarn -v)"
          set +e
          yarn test:unit:offline > /tmp/test-output.txt 2>&1
          code=$?
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/test-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/test-output.txt
          exit $code

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建
        run: yarn build

      - name: 诊断认证状态
        # OIDC 下没有 secret 可查，改为确认三件事：
        #   1. GitHub 是否给了 id-token 权限（没给则 OIDC 会被静默跳过）
        #   2. npm CLI 是否够新（< 11.5.1 没有 oidc 交换逻辑）
        #   3. npm 能否用 OIDC 换到令牌（whoami 会走同一条交换路径）
        #
        # 注意 npm 的失败是"静默降级"：OIDC 拿不到令牌时不报错，而是退回
        # 无凭据状态，最终以 ENEEDAUTH 收场。所以这里必须在发布前显式探测。
        #
        # 输出写进 job summary：steps 的日志需登录态 XHR 拉取，
        # summary 则是页面直接渲染的，无需任何权限。
        # 涉及身份而非凭据本身，OIDC 下也不存在可泄漏的长期令牌。
        run: |
          {
            echo "npm 版本: $(npm --version)（OIDC 需 >= 11.5.1）"
            echo "id-token 端点: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo 已注入 || echo '未注入 —— 检查 permissions 里的 id-token: write')"
            echo "--- npm config 认证项 ---"
            npm config list 2>/dev/null | grep -iE "auth|registry|token" | sed -E 's/(_authToken|_auth) *=.*/\1 = <REDACTED>/' || echo "(无 —— OIDC 模式下属正常，不应出现 _authToken)"
            echo "--- whoami 探测（会走 OIDC 交换）---"
            npm whoami --registry https://registry.npmjs.org/ 2>&1 | head -3 || true
          } | tee /tmp/auth-diag.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/auth-diag.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 发布到 npm
        # 凭据来自 OIDC：npm CLI 检测到 GitHub Actions 环境后，会用
        # ACTIONS_ID_TOKEN_REQUEST_TOKEN 向 GitHub 换 id_token（audience 为
        # npm:registry.npmjs.org），再拿它向 npm 换取会话令牌。
        # 全程无需 .npmrc、无需 NODE_AUTH_TOKEN、无需任何 secret。
        # 该逻辑在 npm 的凭据检查之前执行，成功即直接设置 token。
        #
        # 失败输出写进 job summary：logs 接口需管理员权限，summary 对
        # 所有有仓库访问权的人可见。
        run: |
          set +e
          npm publish --access public --registry https://registry.npmjs.org/ > /tmp/publish.log 2>&1
          code=$?
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/publish.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/publish.log
          exit $code